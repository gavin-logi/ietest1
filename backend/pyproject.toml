# 变更记录: 20261124-1637 target-version 与 Dockerfile 的 Python 3.12 对齐；exclude 改为 extend-exclude 以保留 Ruff 默认排除项；修正 quote-style 注释
# 变更记录: 20261126-0841 新增 [project] 依赖声明（Django 5.2 LTS 骨架）；requirements.txt 由 uv.lock 导出
# 变更记录: 20261126-0902 新增 authlib、requests（SSO）
# 变更记录: 20261126-1345 新增 boto3（对象存储双客户端，见 apps/core/storage.py）

# uv 项目声明：本地用 uv 管理；Dockerfile 用 pip 安装由 uv.lock 导出的 requirements.txt
# 导出命令：uv export --no-hashes --no-dev --no-emit-project --format requirements-txt -o requirements.txt
[project]
name = "app-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",          # LTS，支持到 2028-04
    "dj-database-url>=3.0",      # 解析 DATABASE_URL
    "python-dotenv>=1.1",        # 本机直跑时读取根目录 ../.env
    "whitenoise>=6.9",           # 由 Django 直接提供静态文件与前端产物
    "psycopg[binary]>=3.2",      # PostgreSQL 驱动
    "gunicorn>=23.0",            # 容器内 web 进程
    "authlib>=1.6",              # SSO：OIDC 客户端（discovery、PKCE、id_token 校验）
    "requests>=2.32",            # Authlib 访问 IdP 使用的 HTTP 客户端
    "boto3>=1.35",
]

# 本项目不是可安装的包，uv 只管理依赖
[tool.uv]
package = false

[tool.ruff]
# 目标 Python 版本，与 Dockerfile 的 python:3.12-slim 保持一致
target-version = "py312"

# 每行最大字符数（88 是 Black 和 Ruff 的默认标准，也可按团队习惯改为 100 或 120）
line-length = 88

# 追加排除目录（不进行 Lint 检查，也不进行格式化；保留 Ruff 默认的 .ruff_cache、dist 等排除项）
extend-exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "node_modules",
    "static",
    "media",
    # 忽略所有 Django 自动生成的数据库迁移文件
    "**/migrations/*.py",
]

[tool.ruff.lint]
# 启用的规则集
select = [
    "E",   # pycodestyle 错误（基础 PEP 8 规范）
    "W",   # pycodestyle 警告
    "F",   # Pyflakes（未使用的变量、未定义的名称、无效导入等核心逻辑错误）
    "I",   # isort（自动对 import 语句进行分组和字母排序）
    "B",   # flake8-bugbear（捕获常见的 Python 设计陷阱和潜在 Bug）
    "UP",  # pyupgrade（自动将旧版 Python 语法升级为现代写法）
    "DJ",  # flake8-django（Django 专属最佳实践与反模式检查）
]

# 全局忽略的特定规则
ignore = [
    "E501",   # 忽略行长度超限报错（交给 ruff format 自动换行处理，避免长字符串/URL 报错）
    "DJ001",  # 允许 CharField/TextField 使用 null=True（部分团队习惯兼容旧库，如不需要可删掉这行）
]

# 允许自动修复的规则（ALL 表示只要安全可修的都自动修）
fixable = ["ALL"]

# 针对特定文件的局部规则例外
[tool.ruff.lint.per-file-ignores]
# settings.py 里经常有星号导入（from .base import *）或超长配置项，放宽限制
"**/settings.py" = ["F403", "F405"]
"**/settings/*.py" = ["F403", "F405"]
# 测试文件里允许使用 assert 语句（如果后续开启了 S 安全规则会用到）和未使用的测试夹具参数
"**/tests/*.py" = ["F401", "F811"]
"test_*.py" = ["F401", "F811"]

# Import 排序详细配置（兼容 Django 习惯）
[tool.ruff.lint.isort]
known-first-party = ["config", "apps"] # 替换为你的 Django 项目主模块/app 目录名，使其归类为本地模块
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

# 代码格式化（Pretty）配置，替代 Black
[tool.ruff.format]
# 使用双引号（Ruff / Black 的默认风格；与前端 Prettier 的 singleQuote 设置无关，两者各自独立）
quote-style = "double"
# 使用空格缩进
indent-style = "space"
# 保留魔术尾逗号（当列表/参数末尾有逗号时，强制多行展开，极大减少 Git diff 冲突）
skip-magic-trailing-comma = false


