{% comment %}变更记录: 20261126-0902 新增：SSO 登录失败说明页（浏览器跳转场景，不返回 JSON）{% endcomment %}<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录失败</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 48px 16px; background: #f6f7f9; color: #1f2328; }
    main { max-width: 480px; margin: 0 auto; background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 24px; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    p { line-height: 1.6; margin: 0 0 16px; }
    .trace { font-size: 12px; color: #656d76; }
    a { color: #0969da; }
  </style>
</head>
<body>
  <main>
    <h1>登录失败</h1>
    <p>{{ message }}</p>
    <p><a href="{{ login_url }}">重新登录</a></p>
    {% if request.trace_id %}<p class="trace">联系管理员时请提供追踪编号：{{ request.trace_id }}</p>{% endif %}
  </main>
</body>
</html>
